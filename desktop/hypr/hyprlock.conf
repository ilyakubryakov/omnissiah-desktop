general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Touch the reader or type the password
        present_message = Reading fingerprint...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = calm, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 2.5, calm
    animation = fadeOut, 1, 2, calm
    animation = inputFieldColors, 1, 1.2, calm
    animation = inputFieldDots, 1, 1, calm
}

background {
    monitor =
    path = $lock_wallpaper
    color = $th_back
    blur_passes = 3
    blur_size = 7
    brightness = 0.9
}

shape {
    monitor =
    size = 480, 420
    color = $th_card
    rounding = 8
    border_size = 1
    border_color = $th_accent
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = SESSION LOCKED
    font_size = 12
    font_family = Inter
    color = $th_muted
    position = 0, 165
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Inter Display
    color = $th_text
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 17
    font_family = Inter
    color = $th_soft
    position = 0, 32
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    dots_center = true
    dots_size = 0.22
    rounding = 4
    outer_color = $th_accent
    inner_color = $th_field
    font_color = $th_text
    check_color = $th_success
    fail_color = $th_error
    capslock_color = $th_warning
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL ($ATTEMPTS)
    font_family = Inter
    position = 0, -52
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = $th_muted
    position = 0, -108
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 12
    font_family = Inter
    color = $th_soft
    position = 0, -135
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter to unlock
    font_size = 13
    font_family = Inter
    color = $th_muted
    position = 0, -162
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] "$lock_summary" meeting
    font_size = 14
    font_family = Inter
    color = $th_soft
    position = 0, -250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] "$lock_summary" track
    font_size = 13
    font_family = Inter
    color = $th_muted
    position = 0, -278
    halign = center
    valign = center
}
