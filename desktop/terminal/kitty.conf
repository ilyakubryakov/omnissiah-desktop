include $XDG_STATE_HOME/theme/current/kitty.conf

font_family      JetBrains Mono Nerd Font
font_size 11.0

cursor_shape beam
cursor_trail 1

background_opacity 0.85
background_blur 16

window_margin_width 3
single_window_margin_width 21.75

placement_strategy top-left

confirm_os_window_close 0
shell_integration enabled

map ctrl+c    copy_or_interrupt
map ctrl+v    paste_from_clipboard

map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current

map kitty_mod+left  neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+up    neighboring_window up
map kitty_mod+down  neighboring_window down
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

map ctrl+f   search_scrollback
map kitty_mod+f   search_scrollback

map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
