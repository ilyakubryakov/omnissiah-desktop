# The desktop side of this palette. Read by `theme`; absent keys are skipped.
#
# lookandfeel is deliberately NOT here. The k3lmiir_* packages carry a layout
# script, and applying one rewrites the panels - which is exactly what
# plasma-profile exists to protect. Discrete pieces only.
icontheme=Papirus-Dark
plasmatheme=Ant-Dark
keepawake_icon=keepawake-dark.svg
gtktheme=Breeze-Dark
