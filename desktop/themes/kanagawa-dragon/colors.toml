# Kanagawa Dragon - the single source of truth for this machine's palette.
#
# Roles, not app settings. Every generated config in themes/templates/ reads
# these names, so a colour is corrected here once instead of in five files that
# have already drifted apart (kitty was on Dragon, fzf and LS_COLORS were still
# on Wave, tmux was on Catppuccin).
#
# Values were taken from the live kitty theme, which was the correct one.
# Qt/KDE uses the generated Station.colors scheme alongside GTK and the shell.

mode = "dark"

background        = "#181616"
window_background = "#282727"
dark_background   = "#0d0c0c"
light_background  = "#1d1c19"
faint_background  = "#141313"
selection         = "#2d4f67"

foreground        = "#c5c9c5"
dim_foreground    = "#625e5a"
muted             = "#a6a69c"
faint_foreground  = "#a9ada9"
bright_foreground = "#c8c093"

cursor            = "#c8c093"
accent            = "#8ba4b0"

red        = "#c4746e"
green      = "#8a9a7b"
yellow     = "#c4b28a"
blue       = "#8ba4b0"
magenta    = "#a292a3"
cyan       = "#8ea4a2"
white      = "#c8c093"

bright_red     = "#e46876"
bright_green   = "#87a987"
bright_yellow  = "#e6c384"
bright_blue    = "#7fb4ca"
bright_magenta = "#938aa9"
bright_cyan    = "#7aa89f"
bright_white   = "#c5c9c5"

# Not a terminal colour: only nvim and VS Code use it, for constants.
orange = "#b6927b"

# The macOS menu bar is not a terminal: its text is the system ink over a blur,
# and sketchybar only looks native when it uses the same. Alpha is applied in
# the template, so these two are pure ink and pure chrome.
chrome_ink  = "#ffffff"
chrome_tint = "#000000"
