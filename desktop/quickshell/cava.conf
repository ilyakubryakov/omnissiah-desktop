# cava config for the Quickshell panel media equalizer.
# Emits one line of N ascii values (0-100), ';'-separated, per frame on stdout.
[general]
bars = 14
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.45
