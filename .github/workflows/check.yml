name: Nix checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Make room for the Nix store
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          df -h / /mnt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        id: nix
        continue-on-error: true
      - if: steps.nix.outcome == 'failure'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - run: nix flake check -L
      - if: always()
        run: df -h / /mnt
